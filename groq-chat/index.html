<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Groq Brainstorming Partner</title>
    <!-- Modern Typography from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <header>
        <h1>⚡ Groq Brainstorm</h1>
        <p>Ultra-fast idea generation</p>
      </header>

      <main class="chat-container">
        <div id="chat-history" class="chat-history">
          <div class="message system-message">
            <div class="message-content">Hello! I'm powered by the Groq API. Let's brainstorm. What's on your mind?</div>
          </div>
        </div>
      </main>

      <div class="input-container">
        <form id="chat-form">
          <textarea 
            id="prompt-input" 
            placeholder="Type your idea here... (Press Enter to send)" 
            rows="1"
            autofocus
          ></textarea>
          <button type="submit" id="send-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
